# LoRA layout of the MedSAM3-PDAC weights. It matches MedSAM3-v1 (the starting point of fine-tuning)
# and must not be changed, or the weights will not load.
lora:
  rank: 16
  alpha: 32
  dropout: 0.1
  target_modules: ["q_proj", "k_proj", "v_proj", "out_proj", "qkv", "proj", "fc1", "fc2",
                   "c_fc", "c_proj", "linear1", "linear2"]
  apply_to_vision_encoder: true
  apply_to_text_encoder: true
  apply_to_geometry_encoder: true
  apply_to_detr_encoder: true
  apply_to_detr_decoder: true
  apply_to_mask_decoder: true

# How these weights were trained (for reference; not used by predict.py)
training:
  init: MedSAM3-v1 (lal-Joey/MedSAM3_v1, best_lora_weights.pt)
  data: 77 MSD Task07 patients with confirmed PDAC (2,762 axial slices), concepts "pancreas" and "pancreatic tumor"
  negative_queries: every slice also asked for the absent concept, with an empty target
  epochs: 5
  batch_size: 4
  optimizer: AdamW, learning rate 5e-5 (constant), weight decay 0.01
  frozen: SAM3 base model; only LoRA layers trained
